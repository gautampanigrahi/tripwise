# CI checks for every push and pull request (design section 11, Req 25.2, 28.4).
# deploy.yml reuses this workflow through `workflow_call` as its required first job.
# No AWS credentials are used here: tests run against in-repo fixtures and mocked SDK clients.
name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest --run

      # build-lambdas.mjs shells out to the `zip` CLI. ubuntu-latest ships it;
      # install it only if a future image drops it.
      - name: Ensure zip is available
        run: command -v zip || (sudo apt-get update && sudo apt-get install -y zip)

      - name: Build Lambda bundles
        run: npm run build:lambdas

      - name: Build web
        run: npm run build -w web

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Validate main config
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate bootstrap config
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
